<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poomsae</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen bg-[#111122] text-white">
    <main id="home-main" class="flex min-h-screen items-center justify-center px-4 py-6 sm:px-6">
      <section id="home-card" class="w-full max-w-2xl rounded-2xl border border-white/10 bg-white/[0.03] p-6 shadow-2xl shadow-black/30 backdrop-blur sm:p-10">
        <div>
          <p class="mb-3 text-sm font-semibold uppercase tracking-[0.3em] text-white/50">GENESIS TAEKWONDO</p>
          <h1 class="flex items-center text-4xl font-semibold sm:text-5xl">
            <span class="title-mark"><img src="/poomsae-logo.jpeg" alt="Poomsae mark"/></span>
            <span class="display-font">Poomsae</span>
          </h1>
          <p class="mt-4 text-base text-white/70 sm:text-lg">
            Poomsae is a web application designed to help you learn and practice your Taekwondo forms.
          </p>
        </div>
        <div class="mt-6 flex justify-center sm:mt-8">
          <a
            href="/form-selection"
            class="inline-flex min-h-12 w-full items-center justify-center rounded-xl border border-white/25 bg-white px-8 py-3 text-base font-semibold text-[#111122] shadow-xl shadow-black/25 transition duration-200 hover:-translate-y-0.5 hover:bg-white/90 focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-[#111122] sm:w-auto sm:text-lg"
          >
            Select Form
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
