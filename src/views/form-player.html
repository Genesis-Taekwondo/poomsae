<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Player</title>
    <meta name="theme-color" content="#111122" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Protest+Revolution&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen bg-[#111122] font-sans text-white" style="font-family: 'Noto Sans', sans-serif;">
    <main class="mx-auto flex h-[100dvh] min-h-[540px] w-full max-w-md flex-col overflow-hidden border-x border-white/10 bg-[#111122] shadow-2xl shadow-black/40" data-form-name="{{formName}}">
      <header class="sticky top-0 z-10 shrink-0 border-b border-white/15 bg-[#111122]/75 px-5 pb-3 pt-3 shadow-lg shadow-black/10 backdrop-blur-xl">
        <nav class="flex items-center justify-between gap-3" aria-label="Player navigation">
          <a href="/form-selection" class="min-w-0 truncate whitespace-nowrap text-2xl font-semibold leading-tight focus:outline-none focus-visible:rounded-sm focus-visible:ring-2 focus-visible:ring-white" style="font-family: 'Protest Revolution', sans-serif;" aria-label="Back to form selection">
            {{formName}} <span class="text-xl text-white/70">/ {{formKorean}}</span>
          </a>
          <a href="/" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/25 text-white/70 transition-colors hover:border-white/60 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" aria-label="Home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 10 9-7 9 7" />
              <path d="M5 9v12h14V9M9 21v-7h6v7" />
            </svg>
          </a>
        </nav>
        <div class="mt-2 flex flex-wrap items-center text-xs text-white/70" aria-label="Form details">
          <span class="py-0.5">{{formRank}}</span>
          <span class="mx-4 h-3.5 shrink-0 border-l border-white/25" aria-hidden="true"></span>
          {{formTrigramLabel}}
          <span class="py-0.5">{{formMeaning}}</span>
          <span class="mx-4 h-3.5 shrink-0 border-l border-white/25" aria-hidden="true"></span>
          <span class="py-0.5">{{movementCount}} steps</span>
        </div>
        <p class="mt-1 truncate text-xs text-white/40" title="Techniques introduced">Introduces: {{techniquesIntroduced}}</p>
      </header>

      <section class="step-list-scroll min-h-0 flex-1 overflow-y-auto px-0 py-3" aria-label="Movement steps">
        <ol id="step-list" class="space-y-2">
          {{movements}}
        </ol>
      </section>

      <section class="h-20 shrink-0 overflow-hidden border-t border-white/10 px-5 py-2" aria-label="Step notes" aria-live="polite">
        <div id="notes-row" class="hidden">
          <p class="text-xs text-white/40">Notes</p>
          <p id="context-notes" class="notes-content mt-1 text-sm text-white/90"></p>
        </div>
      </section>

      <footer class="shrink-0 border-t border-white/15 bg-[#111122]/75 px-5 pb-[max(1rem,env(safe-area-inset-bottom))] pt-3 shadow-lg shadow-black/10 backdrop-blur-xl">
        <div class="mb-2 flex items-center justify-between gap-3">
          <button id="previous-step" type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/25 text-white/70 transition-colors hover:border-white/60 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" aria-label="Previous step">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <button id="play-toggle" type="button" class="inline-flex min-h-12 min-w-12 items-center justify-center rounded-full bg-white text-lg text-[#111122] transition-transform hover:scale-105 focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-[#111122]" aria-label="Play steps" aria-pressed="false">
            <span id="play-icon" aria-hidden="true">&#9654;</span>
          </button>
          <button id="next-step" type="button" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/25 text-white/70 transition-colors hover:border-white/60 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" aria-label="Next step">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
        <div class="flex items-center gap-3">
          <label for="step-progress" class="sr-only">Movement progress</label>
          <input id="step-progress" type="range" min="1" max="{{movementCount}}" value="1" class="h-1.5 min-w-0 flex-1 cursor-pointer accent-white" />
          <output id="progress-label" for="step-progress" class="w-12 text-right text-xs tabular-nums text-white/50">1 / {{movementCount}}</output>
        </div>
        <div class="mt-2 flex items-center justify-center gap-1" role="group" aria-label="Playback speed">
          <button type="button" class="speed-option rounded-md px-1.5 py-1.5 text-xs text-white/50 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="0.1" aria-pressed="false">0.1x</button>
          <button type="button" class="speed-option rounded-md px-1.5 py-1.5 text-xs text-white/50 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="0.3" aria-pressed="false">0.3x</button>
          <button type="button" class="speed-option rounded-md px-1.5 py-1.5 text-xs text-white/50 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="0.5" aria-pressed="false">0.5x</button>
          <button type="button" class="speed-option rounded-md px-1.5 py-1.5 text-xs text-white/50 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="0.75" aria-pressed="false">0.75x</button>
          <button type="button" class="speed-option rounded-md bg-white/10 px-1.5 py-1.5 text-xs text-white transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="1" aria-pressed="true">1x</button>
          <button type="button" class="speed-option rounded-md px-1.5 py-1.5 text-xs text-white/50 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="1.3" aria-pressed="false">1.3x</button>
          <button type="button" class="speed-option rounded-md px-1.5 py-1.5 text-xs text-white/50 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="1.5" aria-pressed="false">1.5x</button>
          <button type="button" class="speed-option rounded-md px-1.5 py-1.5 text-xs text-white/50 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="1.75" aria-pressed="false">1.75x</button>
          <button type="button" class="speed-option rounded-md px-1.5 py-1.5 text-xs text-white/50 transition-colors hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" data-speed="2" aria-pressed="false">2x</button>
        </div>
      </footer>
    </main>
    <script>
      (() => {
        const steps = Array.from(document.querySelectorAll('.step-item'));
        const list = document.getElementById('step-list');
        const progress = document.getElementById('step-progress');
        const playButton = document.getElementById('play-toggle');
        const playIcon = document.getElementById('play-icon');
        const intervalMs = 2500;
        let currentIndex = 0;
        let speed = 1;
        let playbackTimer;

        const setStep = (index, shouldScroll = true) => {
          if (!steps.length) return;
          currentIndex = Math.max(0, Math.min(index, steps.length - 1));
          const activeStep = steps[currentIndex];

          steps.forEach((step, stepIndex) => {
            const active = stepIndex === currentIndex;
            step.classList.toggle('border-white', active);
            step.classList.toggle('border-transparent', !active);
            step.classList.toggle('bg-white/[0.06]', active);
            step.classList.toggle('text-white', active);
            step.classList.toggle('text-white/40', !active);
            step.setAttribute('aria-pressed', String(active));
            step.style.transform = active ? 'scale(1)' : 'scale(0.97)';
          });

          document.getElementById('context-notes').textContent = activeStep.dataset.notes || '';
          document.getElementById('notes-row').classList.toggle('hidden', !activeStep.dataset.notes);
          progress.value = String(currentIndex + 1);
          document.getElementById('progress-label').textContent = `${currentIndex + 1} / ${steps.length}`;

          if (shouldScroll) {
            activeStep.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        };

        const setPlaying = playing => {
          window.clearInterval(playbackTimer);
          playButton.setAttribute('aria-pressed', String(playing));
          playButton.setAttribute('aria-label', playing ? 'Pause steps' : 'Play steps');
          playIcon.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';

          if (playing) {
            playbackTimer = window.setInterval(() => {
              if (currentIndex >= steps.length - 1) {
                setPlaying(false);
                return;
              }
              setStep(currentIndex + 1);
            }, intervalMs / speed);
          }
        };

        document.getElementById('previous-step').addEventListener('click', () => setStep(currentIndex - 1));
        document.getElementById('next-step').addEventListener('click', () => setStep(currentIndex + 1));
        playButton.addEventListener('click', () => {
          setPlaying(playButton.getAttribute('aria-pressed') !== 'true');
        });
        progress.addEventListener('input', () => setStep(Number(progress.value) - 1));
        steps.forEach((step, index) => step.addEventListener('click', () => setStep(index, false)));
        document.querySelectorAll('.speed-option').forEach(button => {
          button.addEventListener('click', () => {
            speed = Number(button.dataset.speed);
            document.querySelectorAll('.speed-option').forEach(option => {
              const selected = option === button;
              option.classList.toggle('bg-white/10', selected);
              option.classList.toggle('text-white', selected);
              option.classList.toggle('text-white/50', !selected);
              option.setAttribute('aria-pressed', String(selected));
            });
            if (playButton.getAttribute('aria-pressed') === 'true') setPlaying(true);
          });
        });

        list.addEventListener('keydown', event => {
          if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
            event.preventDefault();
            setStep(currentIndex + 1);
            steps[currentIndex].focus();
          } else if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
            event.preventDefault();
            setStep(currentIndex - 1);
            steps[currentIndex].focus();
          }
        });

        setStep(0, false);
      })();
    </script>
  </body>
</html>
