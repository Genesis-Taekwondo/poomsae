<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Selection</title>
    <meta name="theme-color" content="#111122" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/taeguk-hover.css" />
  </head>
  <body class="min-h-screen bg-[#111122] font-sans text-white" style="font-family: 'Noto Sans', sans-serif;">
    <main id="form-selection-main" class="mx-auto flex h-[100dvh] min-h-[540px] w-full max-w-5xl flex-col overflow-hidden border-x border-white/10 bg-[#111122] shadow-2xl shadow-black/40">
      <header class="shrink-0 border-b border-white/15 bg-[#111122]/75 px-5 py-3 shadow-lg shadow-black/10 backdrop-blur-xl">
        <nav class="flex items-center justify-between gap-3" aria-label="Form selection navigation">
          <h1 class="text-2xl font-semibold leading-tight" style="font-family: 'Protest Revolution', sans-serif;">Select Form</h1>
          <a href="/" class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/25 text-white/70 transition-colors hover:border-white/60 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-white" aria-label="Home">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 10 9-7 9 7" />
              <path d="M5 9v12h14V9M9 21v-7h6v7" />
            </svg>
          </a>
        </nav>
      </header>
      <section id="form-selection-content" class="mx-auto flex min-h-0 w-full max-w-3xl flex-1 flex-col overflow-hidden px-4 py-4 sm:px-6 sm:py-6">
        <div class="form-list-scroll min-h-0 flex-1 overflow-y-auto pr-1 sm:pr-2">
          <ul id="form-groups" class="space-y-4">
            {{formGroups}}
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
