<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Selection</title>
    <meta name="theme-color" content="#020617" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Protest+Revolution&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/taeguk-hover.css" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100" style="font-family: 'Noto Sans', sans-serif;">
    <main class="mx-auto flex h-dvh w-full max-w-5xl items-stretch justify-center px-4 sm:px-6">
      <section class="flex w-full max-w-3xl min-h-0 flex-col overflow-hidden rounded-lg border border-slate-800 bg-slate-950 p-4 shadow-[0_12px_40px_rgba(0,0,0,0.3)] sm:p-6">
        <div class="form-list-scroll min-h-0 flex-1 overflow-y-auto pr-1 sm:pr-2">
          <ul class="space-y-4">
            {{formGroups}}
          </ul>
        </div>
        <div class="mt-4 border-t border-slate-800 pt-4">
          <a href="/" class="inline-flex min-h-11 items-center justify-center rounded-md border border-slate-700 px-5 py-2.5 text-sm font-semibold text-slate-200 transition-colors hover:border-slate-600 hover:bg-slate-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
            Back Home
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
